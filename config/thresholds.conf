# ═══════════════════════════════════════════════════════════════════════════════
# SysKit Scanner v2.0 — Thresholds Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# This file is sourced by bash scripts and parsed by PowerShell / Python.
# Lines starting with # are comments. Use KEY=VALUE format (no spaces around =).

# ─── Memory (MiB) ────────────────────────────────────────────────────────────
MEM_WARN_MB=300
MEM_CRIT_MB=100

# ─── Swap (MiB) ──────────────────────────────────────────────────────────────
SWAP_WARN_MB=100

# ─── Disk Usage (percent, applies to / or C:) ────────────────────────────────
DISK_WARN_PERCENT=80
DISK_CRIT_PERCENT=90

# ─── CPU Load Average per core ───────────────────────────────────────────────
LOAD_WARN=0.8
LOAD_CRIT=1.5

# ─── Dangerous / Unnecessary Ports (comma-separated) ─────────────────────────
# If any of these ports are found LISTENING, bench check will flag FAIL.
DANGEROUS_PORTS=21,23,25,69,111,135,139,445,514,631,1433,1434,3306,3389,5432,5900,6379,8080,9200,27017

# ─── Process count thresholds ────────────────────────────────────────────────
PROC_WARN=250
PROC_CRIT=500

# ─── CIS Benchmark weight (all items equal weight = 1) ──────────────────────
CIS_WEIGHT=1
